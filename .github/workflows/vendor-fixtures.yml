name: Vendor fixture tests

on:
  push:
    paths:
      - 'application/qmodem/**'
      - 'application/qmodem_rm500u_ndppd/**'
      - 'application/libqmodem-sms/**'
      - 'application/qmodem_smsd/**'
      - 'luci/luci-app-qmodem-next/**'
      - 'testcases/**'
      - 'scripts/import_testcases.sh'
      - '.github/workflows/vendor-fixtures.yml'
  pull_request:
    paths:
      - 'application/qmodem/**'
      - 'application/qmodem_rm500u_ndppd/**'
      - 'application/libqmodem-sms/**'
      - 'application/qmodem_smsd/**'
      - 'luci/luci-app-qmodem-next/**'
      - 'testcases/**'
      - 'scripts/import_testcases.sh'
      - '.github/workflows/vendor-fixtures.yml'

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y gcc jq libsodium-dev xxd
      - name: Build and test qmodem-seal
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -o /tmp/qmodem-seal application/qmodem-seal/src/qmodem-seal.c -lsodium
          application/qmodem-seal/tests/test_qmodem_seal.sh /tmp/qmodem-seal
      - name: Check shell syntax
        run: |
          find application/qmodem/files/usr/share/qmodem/cmds \
               application/qmodem/files/usr/share/qmodem/vendor \
               application/qmodem/tests/lib \
               -type f -name '*.sh' -exec sh -n {} +
          sh -n application/qmodem/files/usr/share/qmodem/generic.sh
          sh -n application/qmodem/files/usr/share/qmodem/modem_util.sh
          sh -n application/qmodem/files/usr/share/qmodem/rm500u_ipv6.sh
          sh -n application/qmodem/files/usr/share/qmodem/rm500u_ipv6_watch.sh
          sh -n application/qmodem/files/usr/share/qmodem/rm500u_dhcpv6.script
          sh -n application/qmodem/files/lib/netifd/proto/qmodem_rm500u6.sh
          sh -n application/qmodem/files/usr/sbin/qmodem_collect
          sh -n application/qmodem/tests/test_core_cmds.sh
          sh -n application/qmodem/tests/test_dial_apn_log.sh
          sh -n application/qmodem/tests/test_dial_ipv6_log.sh
          sh -n application/qmodem/tests/test_network_service.sh
          sh -n application/qmodem/tests/test_rm500u_ipv6.sh
          sh -n application/qmodem/tests/test_rm500u_ipv6_watch.sh
          bash -n application/qmodem/tests/test_ipv6_sourcefilter.sh
          sh -n application/qmodem/tests/test_sms_forwarder_conflicts.sh
          sh -n application/qmodem/tests/test_sms_transport_modes.sh
          bash -n application/qmodem/tests/test_collect_encryption.sh
          bash -n application/qmodem/tests/test_fixture_profiles.sh
          sh -n application/qmodem/tests/test_vendor_cmds_boundary.sh
          bash -n application/qmodem/tests/test_fixture_collection_bytes.sh
          bash -n application/qmodem/tests/test_recognition_collection.sh
          bash -n application/qmodem/tests/test_recognition_fixtures.sh
          bash -n application/qmodem/tests/test_vendor_fixtures.sh
      - name: Enforce command boundary
        run: |
          application/qmodem/tests/test_vendor_cmds_boundary.sh
          application/qmodem/tests/test_core_cmds.sh
          sh application/qmodem/tests/test_dial_apn_log.sh
          sh application/qmodem/tests/test_dial_ipv6_log.sh
          sh application/qmodem/tests/test_network_service.sh
          sh application/qmodem/tests/test_rm500u_ipv6.sh
          sh application/qmodem/tests/test_rm500u_ipv6_watch.sh
          bash application/qmodem/tests/test_ipv6_sourcefilter.sh
          application/qmodem/tests/test_sms_forwarder_conflicts.sh
          application/qmodem/tests/test_sms_transport_modes.sh
          node luci/luci-app-qmodem-next/tests/test_sms_service.js
          node luci/luci-app-qmodem-next/tests/test_neighbor_cell.js
          node luci/luci-app-qmodem-next/tests/test_form_sections.js
          node luci/luci-app-qmodem-next/tests/test_rm500u_protocol.js
          sh application/qmodem/tests/test_fibocom_neighbor_identity.sh
          make -C application/libqmodem-sms/tests CFLAGS='-O2 -Wall -Wextra -Werror -std=gnu11 -D_GNU_SOURCE'
          application/qmodem/tests/test_fixture_collection_bytes.sh
          application/qmodem/tests/test_recognition_collection.sh
          application/qmodem/tests/test_recognition_fixtures.sh
          application/qmodem/tests/test_fixture_profiles.sh
          QMODEM_TEST_SEAL_BIN=/tmp/qmodem-seal \
            application/qmodem/tests/test_collect_encryption.sh
      - name: Replay vendor fixtures
        run: application/qmodem/tests/test_vendor_fixtures.sh
